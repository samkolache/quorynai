<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2a1f5c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="#e8e0ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- eye -->
    <path d="M86 236 C150 150 362 150 426 236 C362 322 150 322 86 236 Z"/>
    <!-- crescent moon iris -->
    <path d="M276 180 A58 58 0 1 0 314 252 A44 44 0 1 1 276 180 Z" fill="#e8e0ff" stroke-width="6"/>
    <!-- lashes -->
    <path d="M136 300 L112 330"/>
    <path d="M196 322 L184 360"/>
    <path d="M256 330 L256 372"/>
    <path d="M316 322 L328 360"/>
    <path d="M376 300 L400 330"/>
  </g>
</svg>
